site_name: Brasil Hub
site_description: Documentação do projeto Brasil Hub - Equipe Dijkstra

theme:
  name: material
  language: pt-BR
  features:
    - toc.follow
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Sobre: sobre.md
  - Estratégia:
    - Metodologia: estrategia/metodologia.md
    - Engenharia de Software: estrategia/engsoftware.md
    - DoR e DoD: estrategia/dor-dod.md
  - Gestão de Produto:
    - Solução Proposta: gestao/solucao.md
    - Protótipos: gestao/prototipos.md
    - Requisitos: gestao/requisitos.md
    - Especificações: gestao/especificacoes.md
  - Acompanhamento:
    - Cronograma: acompanhamento/cronograma.md
    - Sprints:
      - Sprint 1: acompanhamento/sprints/sprint01/sprint01.md
      - Sprint 2: acompanhamento/sprints/sprint02/sprint02.md
      - Sprint 3: 
        - Visão Geral: acompanhamento/sprints/sprint03/index.md
        - Dailies: acompanhamento/sprints/sprint03/dailies/dailies.md
      - Sprint 4: 
        - Visão Geral: acompanhamento/sprints/sprint04/index.md
        - Dailies: acompanhamento/sprints/sprint04/dailies/dailies.md
      - Sprint 5: acompanhamento/sprints/sprint05/sprint05.md
      - Sprint 6: acompanhamento/sprints/sprint06/sprint06.md
      - Sprint 7: acompanhamento/sprints/sprint07/sprint07.md
      - Sprint 8: acompanhamento/sprints/sprint08/sprint08.md
      - Sprint 9: acompanhamento/sprints/sprint09/sprint09.md

    - Reuniões:
      - Ata Reunião 01: acompanhamento/reunioes/ata01.md
  - Padrões:
    - Commits: padroes/commits.md
    - Issues: padroes/issues.md
    - Pull Requests: padroes/pullrequest.md
    - Branch: padroes/branches.md
    - Revisão: padroes/revisao.md