site_name: Plataforma de análise de índices sociais e IDH
site_description: Documentação do projeto Time Dijkstra

theme:
  name: material
  language: pt-BR
  features:
    -toc.follow
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Sobre: sobre.md
  - Estratégia:
    - Metodologia: estrategia/metodologia.md
    - Engenharia de Software: estrategia/engsoftware.md
    - DoR e DoD: estrategia/dor-dod.md
  - Gestão de Produto:
    - Solução Proposta: gestao/solucao.md
    - Protótipos: gestao/prototipos.md
    - Requisitos: gestao/requisitos.md
    - Especificações: gestao/especificacoes.md
  - Acompanhamento:
    - Cronograma: acompanhamento/cronograma.md
    - Reuniões:
      - Ata Reunião 01: acompanhamento/reunioes/ata01.md
  - Padrões:
    - Commits: padroes/commits.md
    - Issues: padroes/issues.md
    - Pull Requests: padroes/pullrequest.md