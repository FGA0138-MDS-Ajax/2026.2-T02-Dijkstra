<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <title>Mapa Interativo - Brasil Hub</title>
    <link rel="icon" href="assets/brasil-map.png" type="image/png">
</head>
<body>

    <div class="page-wrapper">
        <header class="floating-header">
            <div class="logo">Brasil Hub</div>
            <nav class="links">
                <a href="./index.html" class="active">Página Inicial</a>
                <a href="./sobre.html">Sobre</a>
                <a href="./mapa.html">Mapa</a>
                <a class="btn" href="./area-adm.html">Área do administrador</a>
            </nav>
        </header>

        <section class="status-section">
            <div id="status-api" class="status-box" hidden>
                <h3 id="status-titulo">Título do Status</h3>
                <p id="status-mensagem">Mensagem descritiva do status...</p>
                <button id="status-tentar" class="btn" hidden>Tentar novamente</button>
            </div>
        </section>

        <section class="map-section">
            <h1 class="map-titulo">Mapa do Brasil Interativo</h1>

            <section class="filtros" aria-label="Filtros de indicadores">
                <div class="filtros__campo">
                    <label for="filtro-estado">Estado</label>
                    <select id="filtro-estado" name="estado"></select>
                </div>
                <div class="filtros__campo">
                    <label for="filtro-dimensao">Dimensão do IDH</label>
                    <select id="filtro-dimensao" name="dimensao"></select>
                </div>
                <button type="button" id="filtro-limpar" class="filtros__limpar">Limpar filtros</button>
            </section>
            <p id="filtros-resumo" class="filtros__resumo" role="status" aria-live="polite">
                Escolha um estado e/ou uma dimensão para filtrar.
            </p>

            <div class="map-container" id="mapa-brasil"></div>
        </section>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
